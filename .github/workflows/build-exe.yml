name: Build Windows EXE

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AutoHotkey v1
        shell: pwsh
        run: |
          $version = "1.1.37.02"
          $url = "https://www.autohotkey.com/download/1.1/AutoHotkey_$version.zip"
          Invoke-WebRequest -Uri $url -OutFile autohotkey.zip
          Expand-Archive autohotkey.zip -DestinationPath autohotkey

      - name: Compile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & ".\autohotkey\Compiler\Ahk2Exe.exe" `
            /in ".\alt-ime-ahk.ahk" `
            /out ".\dist\alt-ime-ahk.exe" `
            /bin ".\autohotkey\Compiler\Unicode 64-bit.bin"
          if (-not (Test-Path ".\dist\alt-ime-ahk.exe")) {
            throw "Compilation failed: dist\alt-ime-ahk.exe was not created."
          }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\dist\alt-ime-ahk.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  alt-ime-ahk.exe" | Set-Content ".\dist\alt-ime-ahk.exe.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: alt-ime-ahk-windows
          path: |
            dist/alt-ime-ahk.exe
            dist/alt-ime-ahk.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            ".\dist\alt-ime-ahk.exe" `
            ".\dist\alt-ime-ahk.exe.sha256" `
            --generate-notes
