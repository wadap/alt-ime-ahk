name: Build Windows EXE

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download AutoHotkey v1
        shell: pwsh
        run: |
          $version = "1.1.37.02"
          $url = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$version/AutoHotkey_$version.zip"
          Invoke-WebRequest -Uri $url -OutFile autohotkey.zip
          Expand-Archive autohotkey.zip -DestinationPath autohotkey

      - name: Compile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & ".\autohotkey\Compiler\Ahk2Exe.exe" `
            /in ".\alt-ime-ahk.ahk" `
            /out ".\dist\alt-ime-ahk.exe" `
            /bin ".\autohotkey\Compiler\Unicode 64-bit.bin"

          # Ahk2Exe may return before its compiler child has finished writing the file.
          # Poll for the actual output instead of waiting on the launcher process.
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline -and -not (Test-Path ".\dist\alt-ime-ahk.exe")) {
            Start-Sleep -Milliseconds 250
          }

          if (-not (Test-Path ".\dist\alt-ime-ahk.exe")) {
            throw "Compilation failed: dist\alt-ime-ahk.exe was not created within 30 seconds."
          }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\dist\alt-ime-ahk.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  alt-ime-ahk.exe" | Set-Content ".\dist\alt-ime-ahk.exe.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: alt-ime-ahk-windows
          path: |
            dist/alt-ime-ahk.exe
            dist/alt-ime-ahk.exe.sha256

      - name: Publish latest downloadable build
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>$null
          gh release create latest `
            ".\dist\alt-ime-ahk.exe" `
            ".\dist\alt-ime-ahk.exe.sha256" `
            --target "${{ github.sha }}" `
            --title "Latest build" `
            --notes "Automated build from commit ${{ github.sha }}." `
            --prerelease

      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            ".\dist\alt-ime-ahk.exe" `
            ".\dist\alt-ime-ahk.exe.sha256" `
            --generate-notes
